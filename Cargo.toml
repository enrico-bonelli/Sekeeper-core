[package]
name = "sekeeper-core"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Formato del vault Sekeeper e logica delle versioni, senza interfaccia né accesso ai file"
license = "MIT"

[features]
# Only for test suites: exposes the public test key and the raw vault key.
testing = []

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

# Exercise the real, deliberately expensive KDF in tests without interpreting its
# hot loops in debug builds. Parameters remain identical to the release build.
[profile.dev.package.argon2]
opt-level = 3
